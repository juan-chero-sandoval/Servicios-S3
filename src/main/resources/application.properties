spring.application.name=vales-atencion
spring.profiles.default=demo
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never

# Healthcheck público y sin detalle (para Docker/orquestador).
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

spring.sql.init.mode=never
spring.jackson.deserialization.fail-on-unknown-properties=true
app.vale-table=${VALE_TABLE:vales}
app.operador.usuario=${OPERADOR_USUARIO:operador}
app.operador.ruc=${OPERADOR_RUC:20100032458}
